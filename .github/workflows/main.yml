name: QA Automation SauceDemo CI

on:
  push:
    branches: [ main, master ] # Jalankan test saat push ke branch main/master
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest # Menggunakan server Linux gratis milik GitHub

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Mengambil kodingan kamu dari repo

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Menginstall selenium, pytest, dll

    - name: Run Automated Tests
      run: |
        # Menjalankan pytest dan menghasilkan data untuk Allure
        pytest --alluredir=allure-results 
      continue-on-error: true # Agar workflow tetap lanjut ke tahap laporan meskipun ada test yang gagal

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        retention-days: 1